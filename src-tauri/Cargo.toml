[package]
name = "luzhi"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luzhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ScreenCaptureKit FFI bindings (macOS 13+)
# ⚠️ 人工审查点：objc2 系列 crate 版本需人工确认兼容性
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"

# Microphone audio capture
cpal = "0.15"
block2 = "0.6"

# Video/audio encoding (optional — requires FFmpeg development libraries)
ffmpeg-next = { version = "7", optional = true }

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]
