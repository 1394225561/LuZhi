[package]
name = "luzhi"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "luzhi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone audio capture (cross-platform)
cpal = "0.15"

# SVG rasterization for cursor assets
resvg = "0.44"
toml = "0.8"
log = "0.4"

# Video/audio encoding (optional — requires FFmpeg development libraries)
ffmpeg-next = { version = "7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# ScreenCaptureKit FFI bindings (macOS 13+)
# ⚠️ 人工审查点：objc2 系列 crate 版本需人工确认兼容性
objc2 = "0.6"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Windows Graphics Capture + WASAPI + Win32 API
# ⚠️ 人工审查点：windows crate 版本需人工确认兼容性
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
ffmpeg = ["dep:ffmpeg-next"]
